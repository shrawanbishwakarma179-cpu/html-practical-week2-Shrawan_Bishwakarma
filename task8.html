<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Media Hub</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">

</head>

<body>

    <h1>My Media Hub</h1>

    <p>
        Welcome to my Media Hub. This page demonstrates
        multimedia and external content using HTML.
    </p>


    <!-- YouTube Video -->
    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube Video"
        allowfullscreen>
    </iframe>


    <!-- Local Video -->
    <h2>Local Video</h2>

    <video width="560" height="315" controls>

        <source src="video.mp4" type="video/mp4">

        <source src="myvideo.mp4" type="video">

        Your browser does not support the video tag.

    </video>


    <!-- Audio -->
    <h2>Audio Clip</h2>

    <audio controls>

        <source src="audio.mp3" type="audio/mpeg">

        Your browser does not support the audio element.

    </audio>


    <!-- Google Map -->
    <h2>PCPS College Location</h2>

    <iframe
        src="https://www.google.com/maps?q=PCPS+College+Kupondole+Lalitpur&output=embed"
        width="600"
        height="450"
        title="PCPS College Location">
    </iframe>


    <!-- External Webpage -->
    <h2>External Webpage</h2>

    <iframe
        src="https://www.wikipedia.org"
        width="600"
        height="300"
        title="External Webpage">
    </iframe>


    <!-- PDF Document -->
    <h2>PDF Document</h2>

    <embed
        src="sample.pdf"
        type="application/pdf"
        width="600"
        height="500">


    <!-- Footer -->
    <hr>

    <p>
        &copy; 2026 My Media Hub
    </p>

</body>

</html>
